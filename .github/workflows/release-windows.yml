name: Build Windows Release

on:
  push:
    tags:
      - 'v3.1.0'
      - 'v3.1.0-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Windows installer
        run: pnpm tauri build

      - name: Generate updater manifest
        run: node scripts/generate-latest-json.mts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompressO-zh-CN-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CompressO 中文版 ${{ github.ref_name }}
          body: |
            简体中文界面版，功能与原版一致。

            系统要求：Windows 10 或更高版本的 64 位设备。安装包内置离线 WebView2 Runtime 安装支持。

            开源说明：本版本遵循 AGPL-3.0-only。完整修改源码、LICENSE、NOTICE 和 THIRD_PARTY_NOTICES 均随发布提供。
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
